 * For more details take a look at the Java Libraries chapter in the Gradle
 * user guide available at https://docs.gradle.org/4.5/userguide/java_library_plugin.html
 */

plugins {
    // Apply the java-library plugin to add support for Java Library
    id 'java-library'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

dependencies {

	//  slf4j-api and commons-lang3 are inherited transitively from limelight_shared_code (declared 'api' there).
	//  See README__Gradle_Dependencies_TransitiveInfo.md

	// https://mvnrepository.com/artifact/org.apache.commons/commons-dbcp2
	implementation 'org.apache.commons:commons-dbcp2:2.14.0'
	
//  Specify dependency on Limelight Shared Code
	
	implementation project(":limelight_shared_code")
	

    // Use JUnit test framework
    // testImplementation 'junit:junit:4.12'
}

// In this section you declare where to find the dependencies of your project
repositories {
    
    mavenCentral()
}
